# The API on Render as four services from one image (Dockerfile), one per role (server/roles.ts):
#   api      takes the console's requests; scale it out freely
#   ingress  Meta's webhooks: store, acknowledge, queue; 2 instances is plenty
#   worker   jobs, collectors, escalation, webhook retries; 1–2 (jobs are leased, so two are safe)
#   stream   live events over SSE; 1 (more work once vercel.json routes /api/stream here)
# The front-end stays on Vercel, which forwards /api to `api` (vercel.json); once these exist, add
# rewrites there for /api/webhooks/* → ingress and /api/stream → stream. Secrets are entered in
# Render's dashboard (sync: false), never committed. Readiness is /api/ready (503 until MongoDB is up).
envVarGroups:
  - name: helo-wizard-api
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_URL # the Vercel domain users open; magic links point here
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: UPSTREAM
        sync: false
      - key: BEARER_TOKEN
        sync: false
      - key: BASE_URL_1
        sync: false
      - key: BASE_URL_2
        sync: false
      - key: BUSINESS_ID
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: WABA_ID
        sync: false
      - key: WABA_NAME
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: PHONE_NAME
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WEBHOOK_APP_SECRETS
        sync: false
      - key: APP_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ES_CONFIG_ID
        sync: false
      - key: EMBEDDED_SIGNUP_LINK
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

services:
  - type: web
    name: helo-wizard-api
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - fromGroup: helo-wizard-api
      - key: ROLE
        value: api
  - type: web
    name: helo-wizard-ingress
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - fromGroup: helo-wizard-api
      - key: ROLE
        value: ingress
  - type: web
    name: helo-wizard-stream
    runtime: docker
    plan: starter
    healthCheckPath: /api/ready
    envVars:
      - fromGroup: helo-wizard-api
      - key: ROLE
        value: stream
  - type: worker
    name: helo-wizard-worker
    runtime: docker
    plan: starter
    envVars:
      - fromGroup: helo-wizard-api
      - key: ROLE
        value: worker
